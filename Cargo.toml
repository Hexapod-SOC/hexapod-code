[package]
name = "hexapod-code"
# For some reason windows wont accept workspace values here
# Soooo we set them twice i guess
version = "0.0.0"
description = "Code for controlling a hexapod robot"
authors = ["Adam", "Michael"]
edition = "2024"

[workspace]
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
description = "Code for controlling a hexapod robot"
authors = ["Adam", "Michael"]
edition = "2024"

[features]
dummy = ["devices/dummy", "audio/dummy"] # enables the devices dummy feature
real  = ["devices/real", "audio/real"]  # enables the devices real feature

[dependencies]
# Workspace crates
devices = { path = "crates/devices" }
movement = { path = "crates/movement" }
audio = { path = "crates/audio" }
# External dependencies
tokio = { version = "1.45.1", features = ["full", "macros", "rt-multi-thread"] }
glam = "0.30.8"

[dev-dependencies]
bevy = "0.17.2"

[workspace.dependencies]
tokio = { version = "1.45.1", features = ["full", "macros", "rt-multi-thread"] }
reqwest = { version = "0.12.23", features = ["blocking", "json"] }
toml = "0.9.8"
serde = "1.0.228"
serde_json = "1.0.145"
once_cell = "1.21.3"
glam = "0.30.8"
pwm-pca9685 = "1.0.0"
linux-embedded-hal = "0.4.0"
sha2 = "0.10.9"

