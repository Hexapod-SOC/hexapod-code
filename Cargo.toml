[package]
name = "hexapod-code"
version.workspace = true
description.workspace = true
authors.workspace = true
edition.workspace = true

[workspace]
members = [
    "crates/audio",
    "crates/devices", 
    "crates/hexmath",
    "crates/hexmath/bevyexmaple",
    "crates/lidar-slam",
    "crates/web-panel",
]

[workspace.package]
version = "0.0.0"
description = "Code for controlling a hexapod robot"
authors = ["Adam", "Michael"]
edition = "2024"

[features]
dummy = ["devices/dummy", "audio/dummy", "lidar-slam/dummy"] # enables the devices dummy feature
real  = ["devices/real", "audio/real", "lidar-slam/real"]  # enables the devices real feature
dummyslamreal = ["devices/dummy", "audio/dummy", "lidar-slam/real"] # devices dummy, lidar-slam real

[dependencies]
# Workspace crates
devices = { path = "crates/devices" }
hexmath = { path = "crates/hexmath" }
audio = { path = "crates/audio" }
web-panel = { path = "crates/web-panel" }
lidar-slam = { path = "crates/lidar-slam" }

# External dependencies
tokio = { version = "1.45.1", features = ["full", "macros", "rt-multi-thread"] }
glam = "0.30.8"

# API dependencies (now in src/api/)
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
bevy = "0.17.2"
pwm-pca9685 = "1.0.0"
linux-embedded-hal = "0.4.0"

[workspace.dependencies]
tokio = { version = "1.45.1", features = ["full", "macros", "rt-multi-thread"] }
reqwest = { version = "0.12.23", features = ["blocking", "json"] }
toml = "0.9.8"
serde = "1.0.228"
serde_json = "1.0.145"
once_cell = "1.21.3"
glam = "0.30.8"
pwm-pca9685 = "1.0.0"
linux-embedded-hal = "0.4.0"
sha2 = "0.10.9"
anyhow = "1.0"

