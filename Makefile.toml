# PC BUILDS
[tasks.pccheck]
command = "cargo"
args = ["check", "--features", "dummy"]
workspace = false

[tasks.pcbuild]
command = "cargo"
args = ["build", "--features", "dummy"]
workspace = false

[tasks.pcbuildrelease]
command = "cargo"
args = ["build", "--features", "dummy", "--release"]
workspace = false

[tasks.pcrun]
command = "cargo"
args = ["run", "--release", "--features", "dummy"]
workspace = false

[tasks.pcrunrelease]
command = "cargo"
args = ["run", "--features", "dummy", "--release"]
workspace = false

[tasks.pcrunsim]
command = "cargo"
args = ["run", "-p", "hexapod_sim"]
workspace = false

# RASPBERRY PI BUILDS
[tasks.picheck]
command = "cross"
args = ["check", "--target", "aarch64-unknown-linux-gnu", "--features", "real"]
workspace = false

[tasks.pibuild]
command = "cross"
args = ["build", "--target", "aarch64-unknown-linux-gnu", "--features", "real"]
workspace = false

[tasks.pibuildrelease]
command = "cross"
args = ["build", "--target", "aarch64-unknown-linux-gnu", "--features", "real", "--release"]
workspace = false

[tasks.pirunremote]
workspace = false

[tasks.pirunremote.linux]
command = "cargo"
args = ["hexapod-devkit", "remoterun", "--local"]

[tasks.pirunremote.windows]
command = "powershell"
args = ["-ExecutionPolicy", "Bypass", "-File", "remoterun.ps1", "-r"]

[tasks.pcrunai]
workspace = false

[tasks.pcrunai.linux]
command = "bash"
args = ["-lc", "cd ai && nix-shell shell.nix --run 'HEXAPOD_API_BASE=\"http://localhost:3000/api\" AI_CHAT_PORT=3001 python main.py'"]

[tasks.pcrunai.windows]
command = "powershell"
args = ["-NoProfile", "-Command", "$env:HEXAPOD_API_BASE='http://localhost:3000/api'; $env:AI_CHAT_PORT='3001'; python ai/main.py"]