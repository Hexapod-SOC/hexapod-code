<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Hexapod body -->
  <ellipse cx="50" cy="50" rx="20" ry="15" fill="url(#grad)"/>
  <!-- Legs (6 legs) -->
  <!-- Left legs -->
  <path d="M 35 40 L 15 20" stroke="url(#grad)" stroke-width="3" fill="none"/>
  <path d="M 30 50 L 10 50" stroke="url(#grad)" stroke-width="3" fill="none"/>
  <path d="M 35 60 L 15 80" stroke="url(#grad)" stroke-width="3" fill="none"/>
  <!-- Right legs -->
  <path d="M 65 40 L 85 20" stroke="url(#grad)" stroke-width="3" fill="none"/>
  <path d="M 70 50 L 90 50" stroke="url(#grad)" stroke-width="3" fill="none"/>
  <path d="M 65 60 L 85 80" stroke="url(#grad)" stroke-width="3" fill="none"/>
</svg>
